name: "Bug"
description: "Something on the site, API, MCP server, or CLI behaves wrong."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Everything you write here is public — don't paste secrets or message
        content.
  - type: dropdown
    id: surface
    attributes:
      label: "Surface"
      options:
        - Website (1mail.dev)
        - REST API (api.1mail.dev)
        - MCP server
        - CLI (1mail)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened"
      description: "What you did, what you expected, and what you got instead."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "CLI version, MCP client, or the request/response pair if relevant."
